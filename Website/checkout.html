<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShopEase - Checkout</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->
    <header>
        <nav class="navbar">
            <div class="logo">ShopEase</div>

            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a href="cart.html">Cart 🛒</a></li>
            </ul>
        </nav>
    </header>

    <!-- Checkout Header -->
    <section class="page-header">
        <h1>Checkout</h1>
        <p>Complete your order by providing your details.</p>
    </section>

    <!-- Checkout Section -->
    <section class="checkout-section">

        <!-- Customer Information -->
        <div class="checkout-form">

            <h2>Customer Information</h2>

            <form onsubmit="placeOrder(event)">

                <label for="name">Full Name</label>
                <input type="text" id="name" placeholder="Enter your full name" required>

                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" placeholder="Enter your phone number" required>

                <label for="address">Delivery Address</label>
                <textarea id="address" rows="4" placeholder="Enter your complete address" required></textarea>

                <label for="payment">Payment Method</label>

                <select id="payment" required>
                    <option value="">Select Payment Method</option>
                    <option value="Cash on Delivery">Cash on Delivery</option>
                    <option value="Bank Transfer">Bank Transfer</option>
                </select>

                <button type="submit" class="checkout-btn">
                    Place Order
                </button>

            </form>

        </div>

        <!-- Order Summary -->
        <div class="checkout-summary">

            <h2>Order Summary</h2>

            <div id="checkout-items"></div>

            <hr>

            <p>Subtotal: <strong id="checkout-subtotal">Rs. 0</strong></p>

            <p>Delivery: <strong>Rs. 500</strong></p>

            <h3>Total: <span id="checkout-total">Rs. 500</span></h3>

        </div>

    </section>

    <!-- Footer -->
    <footer>
        <h3>ShopEase</h3>
        <p>Your trusted online shopping store.</p>
        <p>© 2026 ShopEase. All Rights Reserved.</p>
    </footer>

    <!-- JavaScript -->
    <script src="script.js"></script>

</body>
</html>
